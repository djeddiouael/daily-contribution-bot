
name: Daily Contribution

on:
  schedule:
    - cron: "30 17 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Configure Git
        run: |
          git config user.name "djeddiouael"
          git config user.email "djeddi.ouael.00@gmail.com"

      - name: Update daily file
        run: |
          date -u +"Last update: %Y-%m-%d" > daily.txt
          git add daily.txt
          git diff --cached --quiet || git commit -m "Daily contribution"
          git push
