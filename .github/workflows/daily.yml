
name: Hourly Contribution

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Configure Git
        run: |
          git config user.name "djeddiouael"
          git config user.email "djeddi.ouael.00@gmail.com"

      - name: Update hourly file
        run: |
          date -u +"Last update: %Y-%m-%d %H:%M:%S UTC" > daily.txt
          git add daily.txt
          git commit -m "Hourly update $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
